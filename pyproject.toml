[project]
name = "asr-transcribe"
version = "1.6.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "colorlog==6.8.2",
    "ctranslate2==4.5.0",
    "jinja2==3.1.4",
    "llama-cpp-python>=0.3.20",
    "pycairo>=1.29.0",
    "pyexcel-ods3==0.6.1",
    "pytest==8.3.3",
    "toml==0.10.2",
    "weasyprint==68.0",
    "whisperx==3.8.5",
    "xhtml2pdf==0.2.16",
]

[tool.ruff.lint]
# Ruff's historical default rule set, pinned explicitly. Without this the
# enforced rules change with every ruff release: 0.16.0 widened the defaults
# and reported 133 findings in code that had not meaningfully changed, which
# is what broke CI run #250. These four selectors are what Astral recommends
# for keeping the former set. Widening it is a deliberate decision, not a side
# effect of an upgrade.
select = ["E4", "E7", "E9", "F"]
